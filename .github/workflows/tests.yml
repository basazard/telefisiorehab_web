name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Build assets
        run: |
          npm ci
          npm run build

      # Tests use SQLite in memory (phpunit.xml).
      - name: Run tests
        run: php artisan test --compact --log-junit junit.xml

      # Clinical sign-off (PRD 10 W5): a warning only, until the owner sets the repository variable CLINICAL_STRICT=true.
      - name: Clinical sign-off
        env:
          CLINICAL_STRICT: ${{ vars.CLINICAL_STRICT }}
        run: |
          if [ "$CLINICAL_STRICT" = "true" ]; then
            php artisan clinical:status --strict
          else
            php artisan clinical:status --strict || echo "::warning title=Clinical sign-off::Clinical rules are not signed off yet (PRD 10). After the sign-off, set the repository variable CLINICAL_STRICT=true so this step fails the build."
          fi

      # Lists each failing test as an annotation on the run page.
      - name: Report failing tests
        if: failure()
        run: |
          php -r '
            $xml = @simplexml_load_file("junit.xml");
            if (! $xml) { exit; }
            foreach ($xml->xpath("//testcase[failure or error]") as $case) {
                $why = (string) ($case->failure ?: $case->error);
                echo "::error title=", $case["class"], "::", $case["name"], ": ", str_replace(["\r", "\n"], " ", substr($why, 0, 300)), PHP_EOL;
            }'
